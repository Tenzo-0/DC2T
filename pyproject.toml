[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dc2t"
version = "0.1.0"
description = "DC2T: text-to-music for Don ca tai tu"
requires-python = ">=3.10"
# Only what every environment needs. transformers is NOT here: the language-model environment uses 4.57.1, the codec environment keeps MuCodec's pin.
dependencies = [
  "torch>=2.2",
  "numpy",
  "pyyaml>=6",
  "accelerate>=1.15,<2",
  "safetensors>=0.4.3",
  "soundfile>=0.10.2",
]

[project.optional-dependencies]
lm = ["transformers==4.57.1"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["dc2t*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
